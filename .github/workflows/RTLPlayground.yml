name: Build FG-4GT-2SX_V2.0 Firmware

on:
  workflow_dispatch: # 支持在 GitHub 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout logicog/RTLPlayground
        uses: actions/checkout@v7
        with:
          repository: 'logicog/RTLPlayground' # 拉取外部目标仓库
          submodules: 'recursive'            # 递归拉取子模块
          fetch-depth: 0

      - name: Install Build Dependencies & Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-mips-linux-gnu \
            g++-mips-linux-gnu \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            device-tree-compiler \
            u-boot-tools \
            libssl-dev \
            pkg-config \
            bison \
            flex \
            bc \
            cpio

      - name: Build FG-4GT-2SX_V2.0
        run: |
          # 自动探测并执行编译
          if [ -f "CMakeLists.txt" ]; then
            cmake -B build -DBOARD=FG-4GT-2SX_V2.0
            cmake --build build -j$(nproc)
          elif [ -f "Makefile" ]; then
            make FG-4GT-2SX_V2.0 -j$(nproc) || make BOARD=FG-4GT-2SX_V2.0 -j$(nproc)
          elif [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh FG-4GT-2SX_V2.0
          else
            echo "未找到标准构建入口，请检查仓库构建方式"
            ls -la
            exit 1
          fi

      - name: Collect Firmware Artifacts
        run: |
          mkdir -p output
          # 搜索生成的固件文件（.bin、.img、.rom 等）
          find . -maxdepth 4 -type f \( -name "*.bin" -o -name "*.img" -o -name "*.rom" \) -not -path "*/.*" -exec cp {} output/ \;
          echo "=== 收集到的固件文件列表 ==="
          ls -lh output/

      - name: Upload Firmware to GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: FG-4GT-2SX_V2.0-Firmware
          path: output/*
