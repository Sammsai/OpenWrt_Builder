name: Build RTLPlayfround Firmware

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Machine type'
        required: true
        type: choice
        options:
          - FG-4GT-2SX_V2.0
          - PCB_K0402WS_V3
          - PCB_K0402WS_V2
          - STEAMEMO_IG204_V1
          - FNS1200P
          - HY_TFS106
      ip_address:
        description: 'Default Management IP'
        required: true
        default: '192.168.1.239'
        type: string
      gateway:
        description: 'Default Gateway'
        required: true
        default: '192.168.1.1'
        type: string
      branch:
        description: 'RTLPlayground branch or tag'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout RTLPlayground
        uses: actions/checkout@v7
        with:
          repository: 'Sammsai/RTLPlayground'
          ref: ${{ inputs.branch || 'main' }}

      - name: Install build dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev -y

      - name: Customize default network config
        run: |
          IP="${{ inputs.ip_address || '192.168.1.239' }}"
          GW="${{ inputs.gateway || '192.168.1.1' }}"
          sed -i "s/^ip .*/ip ${IP}/" config.txt
          sed -i "s/^gw .*/gw ${GW}/" config.txt
          echo "Updated config.txt:"
          cat config.txt

      - name: Build firmware
        run: make MACHINE="${{ inputs.type }}"

      - name: Build OEM upgrade installer
        run: make -C installer

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RTLPlayground-${{ inputs.type }}
          path: |
            output/${{ inputs.type }}/*.bin
            installer/output/*.bin
          if-no-files-found: error
