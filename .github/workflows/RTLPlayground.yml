name: Build FG-4GT-2SX_V2.0 Firmware

on:
  workflow_dispatch:
    inputs:
      machine:
        description: 'Target machine to build'
        required: true
        default: 'FG_4GT_2SX_V2_0'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout logicog/RTLPlayground
        uses: actions/checkout@v7
        with:
          repository: 'logicog/RTLPlayground'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev -y
      - name: Run the host-side unit tests
        run: make -C test
      - name: Check if machine.c can be compiled for all machines
        run: make machine_check
      - name: Make project
        run: make MACHINE="${{ inputs.machine || 'FG_4GT_2SX_V2_0' }}"
      - name: Make installer (OEM upgrade image)
        run: make -C installer
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ inputs.machine || 'FG_4GT_2SX_V2_0' }}
          path: |
            output/*/*.bin
            installer/output/*.bin
          if-no-files-found: error
