name: Build FG-4GT-2SX_V2.0 Firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag of RTLPlayground to build'
        required: true
        default: 'main'
        type: string
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout RTLPlayground
        uses: actions/checkout@v7
        with:
          repository: 'logicog/RTLPlayground'
          ref: ${{ inputs.branch || 'main' }}

      - name: Install build dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev -y

      - name: Build firmware
        run: make MACHINE="FG_4GT_2SX_V2_0"

      - name: Build OEM upgrade installer
        run: make -C installer

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RTLPlayground-FG_4GT_2SX_V2_0
          path: |
            output/FG_4GT_2SX_V2_0/*.bin
            installer/output/*.bin
          if-no-files-found: error
