name: Build FG-4GT-2SX_V2.0 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout logicog/RTLPlayground
        uses: actions/checkout@v7
        with:
          repository: 'logicog/RTLPlayground'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install Build Dependencies & SDCC & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-mips-linux-gnu \
            g++-mips-linux-gnu \
            sdcc \
            libjson-c-dev \
            zlib1g-dev \
            libssl-dev \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            device-tree-compiler \
            u-boot-tools \
            pkg-config \
            bison \
            flex \
            bc \
            cpio

      - name: Fix include path & Build Firmware
        run: |
          # 建立 json-c 头文件软链接防止老代码引用路径不一致
          if [ -d "/usr/include/json-c" ] && [ ! -f "/usr/include/json.h" ]; then
            sudo ln -sf /usr/include/json-c/json.h /usr/include/json.h
            sudo ln -sf /usr/include/json-c /usr/include/json
          fi

          # 优先使用 TARGET 参数编译，如果不支持则尝试 BOARD 参数
          make TARGET=FG-4GT-2SX_V2.0 -j$(nproc) || make BOARD=FG-4GT-2SX_V2.0 -j$(nproc)

      - name: Collect Output Artifacts
        run: |
          mkdir -p output_firmware
          # 搜索生成的固件文件
          find . -maxdepth 4 -type f \( -name "*.bin" -o -name "*.img" -o -name "*.rom" -o -name "*.trx" \) -not -path "*/.*" -not -path "./output_firmware/*" -exec cp {} output_firmware/ \;
          echo "=== 编译生成的固件列表 ==="
          ls -lh output_firmware/

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FG-4GT-2SX_V2.0-Firmware
          path: output_firmware/*
